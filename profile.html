<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Profile - Path Pal AI</title>
  
  <!-- FontAwesome & Custom styling links -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="style.css"/>
  
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      min-height: 100vh;
      overflow: auto;
    }
    
    .profile-wrapper {
      width: 100%;
      max-width: 500px;
      margin: 20px;
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    .profile-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      position: relative;
    }
    
    .profile-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .profile-logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent-blue, #3b82f6), var(--accent-cyan, #06b6d4));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: white;
      margin: 0 auto 12px;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
    }
    
    .profile-title {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    
    .profile-subtitle {
      font-size: 13px;
      color: var(--text-muted, #94a3b8);
    }
    
    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
    }
    
    .form-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted, #94a3b8);
      margin-bottom: 8px;
    }
    
    .input-field {
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: white;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    
    .input-field:focus {
      border-color: var(--accent-cyan, #06b6d4);
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
    }

    .select-field {
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 16px;
      padding-right: 40px !important;
    }
    
    .btn-submit {
      margin-top: 10px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-blue, #3b82f6), var(--accent-cyan, #06b6d4));
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
    }
    
    .btn-submit:hover {
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-dim, #64748b);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  
  <!-- Supabase Web SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script src="js/supabase.js"></script>
  <script src="js/guard.js"></script>
</head>
<body>

  <div class="profile-wrapper">
    <div class="profile-card">
      <div class="profile-header">
        <div class="profile-logo">
          <i class="fa-solid fa-user-gear"></i>
        </div>
        <h2 class="profile-title">Setup Profile</h2>
        <div class="profile-subtitle">Please complete registration details to secure your routes.</div>
      </div>

      <form id="profile-form" class="form-grid">
        <!-- Name -->
        <div class="form-group">
          <label class="form-label" for="profile-name">Full Name</label>
          <input type="text" id="profile-name" class="input-field" placeholder="Enter your full name" required autocomplete="off">
        </div>

        <!-- Phone (Prefilled, disabled) -->
        <div class="form-group">
          <label class="form-label" for="profile-phone">Phone Number</label>
          <input type="tel" id="profile-phone" class="input-field" disabled style="opacity:0.6; cursor:not-allowed;">
        </div>

        <!-- Emergency Contact -->
        <div class="form-group">
          <label class="form-label" for="profile-emergency">Emergency Contact Mobile</label>
          <input type="tel" id="profile-emergency" class="input-field" placeholder="Emergency contact phone number" maxlength="10" required autocomplete="off">
        </div>

        <!-- Gender -->
        <div class="form-group">
          <label class="form-label" for="profile-gender">Gender</label>
          <select id="profile-gender" class="input-field select-field" required>
            <option value="" disabled selected>Select Gender</option>
            <option value="Female">Female</option>
            <option value="Male">Male</option>
            <option value="Other">Other</option>
            <option value="Prefer not to say">Prefer not to say</option>
          </select>
        </div>

        <!-- City -->
        <div class="form-group">
          <label class="form-label" for="profile-city">City</label>
          <input type="text" id="profile-city" class="input-field" placeholder="E.g. Chennai, Coimbatore, Madurai" required autocomplete="off">
        </div>

        <!-- Role for testing purposes -->
        <div class="form-group" style="margin-top: 5px;">
          <label class="form-label" for="profile-role">Choose Account Type</label>
          <select id="profile-role" class="input-field select-field" required>
            <option value="user">Standard User (Safe Navigation & SOS)</option>
            <option value="admin">Administrator (Approve & Manage Reports)</option>
          </select>
        </div>

        <button type="submit" id="btn-save-profile" class="btn-submit">
          <span>Save & Proceed</span> <i class="fa-solid fa-arrow-right-to-bracket"></i>
        </button>
      </form>
    </div>
  </div>

  <script src="js/profile.js"></script>
</body>
</html>
