<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Path Pal AI</title>
  
  <!-- FontAwesome & Outfit font -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="style.css"/>
  
  <style>
    body {
      overflow-y: auto !important;
      background: #020617;
    }
    
    #admin-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 20px;
    }
    
    .admin-title-box h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(90deg, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .admin-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }
    
    .btn-back-dash {
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      cursor: pointer;
    }
    
    .btn-back-dash:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: #06b6d4;
    }
    
    /* Stats Row */
    .admin-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    
    .admin-stat-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(10px);
    }
    
    .admin-stat-info .num {
      font-family: 'Outfit', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: white;
    }
    
    .admin-stat-info .lbl {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
      font-weight: 500;
    }
    
    .admin-stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: rgba(6, 182, 212, 0.1);
      color: #06b6d4;
    }

    .admin-stat-card.pending .admin-stat-icon {
      background: rgba(245, 158, 11, 0.1);
      color: #f59e0b;
    }

    .admin-stat-card.approved .admin-stat-icon {
      background: rgba(16, 185, 129, 0.1);
      color: #10b981;
    }

    .admin-stat-card.users .admin-stat-icon {
      background: rgba(139, 92, 246, 0.1);
      color: #8b5cf6;
    }
    
    /* Layout Main */
    .admin-main-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 30px;
    }
    
    @media (max-width: 900px) {
      .admin-main-grid {
        grid-template-columns: 1fr;
      }
    }
    
    .panel-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(10px);
      margin-bottom: 30px;
    }
    
    .panel-title {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: white;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 12px;
    }
    
    /* Reports List */
    .reports-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .report-item {
      background: rgba(30, 41, 59, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.2s;
    }
    
    .report-item:hover {
      border-color: rgba(6, 182, 212, 0.3);
      background: rgba(30, 41, 59, 0.5);
    }
    
    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .report-badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .report-badge.pending {
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    
    .report-badge.approved {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .report-type-txt {
      font-weight: 700;
      color: white;
      font-size: 15px;
    }
    
    .report-body {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
    }
    
    .report-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 11px;
      color: #64748b;
    }
    
    .report-meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .report-photo-thumb {
      max-width: 100%;
      max-height: 180px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 8px;
    }
    
    .report-actions {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    
    .btn-action {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    
    .btn-approve {
      background: #10b981;
      color: white;
    }
    .btn-approve:hover {
      background: #059669;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
    }
    
    .btn-reject {
      background: #f59e0b;
      color: white;
    }
    .btn-reject:hover {
      background: #d97706;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
    }
    
    .btn-delete {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .btn-delete:hover {
      background: #ef4444;
      color: white;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
    }
    
    /* Users List */
    .users-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .user-item {
      background: rgba(30, 41, 59, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(139, 92, 246, 0.15);
      color: #8b5cf6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
    }
    
    .user-info {
      flex: 1;
      min-width: 0;
    }
    
    .user-name {
      color: white;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .user-phone {
      color: #64748b;
      font-size: 11px;
      margin-top: 2px;
    }
    
    .user-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    
    .user-badge.admin {
      background: rgba(139, 92, 246, 0.2);
      color: #a78bfa;
      border: 1px solid rgba(139, 92, 246, 0.4);
    }

    .user-badge.user {
      background: rgba(148, 163, 184, 0.15);
      color: #94a3b8;
    }

    .no-data {
      text-align: center;
      padding: 40px 20px;
      color: #64748b;
      font-size: 13px;
    }
  </style>
  
  <!-- Supabase Web SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script src="js/supabase.js"></script>
  <script src="js/guard.js"></script>
</head>
<body>

  <div id="admin-container">
    
    <!-- Admin Header -->
    <header class="admin-header">
      <div class="admin-title-box">
        <h1>Path Pal AI Administrator Panel</h1>
        <div class="admin-subtitle">Manage user safety reports, verify hazards, and coordinate security indices.</div>
      </div>
      <a href="index.html" class="btn-back-dash">
        <i class="fa-solid fa-arrow-left-long"></i> Back to Dashboard
      </a>
    </header>

    <!-- Stats Grid -->
    <section class="admin-stats-grid">
      <div class="admin-stat-card">
        <div class="admin-stat-info">
          <div id="stat-total-reports" class="num">0</div>
          <div class="lbl">Total Submissions</div>
        </div>
        <div class="admin-stat-icon"><i class="fa-solid fa-folder-open"></i></div>
      </div>

      <div class="admin-stat-card pending">
        <div class="admin-stat-info">
          <div id="stat-pending-reports" class="num">0</div>
          <div class="lbl">Pending Review</div>
        </div>
        <div class="admin-stat-icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
      </div>

      <div class="admin-stat-card approved">
        <div class="admin-stat-info">
          <div id="stat-approved-reports" class="num">0</div>
          <div class="lbl">Approved & Active</div>
        </div>
        <div class="admin-stat-icon"><i class="fa-solid fa-circle-check"></i></div>
      </div>

      <div class="admin-stat-card users">
        <div class="admin-stat-info">
          <div id="stat-active-users" class="num">0</div>
          <div class="lbl">Registered Users</div>
        </div>
        <div class="admin-stat-icon"><i class="fa-solid fa-users"></i></div>
      </div>
    </section>

    <!-- Main Content -->
    <main class="admin-main-grid">
      
      <!-- Left Column: Reports Management -->
      <section class="panel-box">
        <div class="panel-title">
          <i class="fa-solid fa-list-check" style="color:#06b6d4;"></i> Safety Reports Queue
        </div>
        
        <div id="reports-list-container" class="reports-list">
          <div class="no-data"><i class="fa-solid fa-spinner fa-spin" style="margin-right:8px;"></i> Loading reports database...</div>
        </div>
      </section>

      <!-- Right Column: Registered Users list -->
      <section class="panel-box">
        <div class="panel-title">
          <i class="fa-solid fa-users-gear" style="color:#8b5cf6;"></i> System Users
        </div>
        
        <div id="users-list-container" class="users-list">
          <div class="no-data"><i class="fa-solid fa-spinner fa-spin" style="margin-right:8px;"></i> Loading user records...</div>
        </div>
      </section>

    </main>

  </div>

  <script src="js/admin.js"></script>
</body>
</html>
