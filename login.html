<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Path Pal AI – AI Powered Smart Safe Route Navigation System</title>
  
  <!-- FontAwesome & Outfit font -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="style.css"/>
  
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      min-height: 100vh;
      overflow: auto;
    }
    
    .login-wrapper {
      width: 100%;
      max-width: 450px;
      margin: 20px;
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    .login-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    
    .login-header {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-bottom: 35px;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent-blue, #3b82f6), var(--accent-cyan, #06b6d4));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: white;
      margin: 0 auto 16px;
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.45);
      animation: pulseGlow 3s infinite alternate;
    }
    
    .login-title {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    
    .login-subtitle {
      font-size: 13px;
      color: var(--text-muted, #94a3b8);
      line-height: 1.5;
    }

    .form-group {
      position: relative;
      margin-bottom: 20px;
      z-index: 1;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted, #94a3b8);
      margin-bottom: 8px;
    }

    .phone-input-container {
      display: flex;
      gap: 10px;
    }

    .country-code {
      width: 80px;
      text-align: center;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: white;
      font-size: 14px;
      outline: none;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
    }

    .input-field {
      flex: 1;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: white;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .input-field:focus {
      border-color: var(--accent-cyan, #06b6d4);
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-blue, #3b82f6), var(--accent-cyan, #06b6d4));
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      z-index: 1;
      position: relative;
    }

    .btn-login:hover {
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
      transform: translateY(-1px);
    }

    .btn-login:disabled {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-dim, #64748b);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .slide-section {
      display: none;
    }

    .slide-section.active {
      display: block;
      animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #recaptcha-container {
      margin: 15px 0 0;
    }

    .info-footer {
      text-align: center;
      margin-top: 25px;
      font-size: 12px;
      color: var(--text-dim, #64748b);
      z-index: 1;
      position: relative;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 15px rgba(6, 182, 212, 0.3); }
      100% { box-shadow: 0 0 30px rgba(6, 182, 212, 0.7); }
    }
  </style>
  
  <!-- Firebase Compat libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <!-- Config, Auth, and Guard script references -->
  <script src="js/firebase.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/auth.js"></script>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2 class="login-title">Path Pal AI</h2>
        <div class="login-subtitle">AI Powered Smart Safe Route Navigation System</div>
      </div>

      <!-- STEP 1: Enter Phone Number -->
      <div id="step-phone-section" class="slide-section active">
        <div class="form-group">
          <label class="form-label">Enter Mobile Number</label>
          <div class="phone-input-container">
            <div class="country-code">+91</div>
            <input type="tel" id="input-phone" class="input-field" placeholder="10-digit number" maxlength="10" autocomplete="off">
          </div>
        </div>
        
        <button id="btn-send-otp" class="btn-login" disabled>
          <span>Send OTP</span> <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>

      <!-- STEP 2: Enter Verification Code -->
      <div id="step-otp-section" class="slide-section">
        <div class="form-group">
          <label class="form-label">Enter 6-Digit OTP</label>
          <input type="text" id="input-otp" class="input-field" placeholder="xxxxxx" maxlength="6" style="text-align:center; font-size:20px; letter-spacing:0.3em;" autocomplete="off">
        </div>
        
        <button id="btn-verify-otp" class="btn-login">
          <span>Verify OTP</span> <i class="fa-solid fa-check"></i>
        </button>
        
        <div style="text-align: center; margin-top: 15px;">
          <a href="#" id="link-resend" style="color: var(--accent-cyan, #06b6d4); font-size: 13px; text-decoration: none;">Change phone number</a>
        </div>
      </div>

      <!-- Invisible reCAPTCHA Anchor -->
      <div id="recaptcha-container"></div>
      
      <div class="info-footer">
        Secured by Firebase Phone Authentication. By signing in, you agree to enable emergency SOS location tracking.
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const phoneInput = document.getElementById("input-phone");
      const sendOtpBtn = document.getElementById("btn-send-otp");
      const otpInput = document.getElementById("input-otp");
      const verifyOtpBtn = document.getElementById("btn-verify-otp");
      const phoneSection = document.getElementById("step-phone-section");
      const otpSection = document.getElementById("step-otp-section");
      const changePhoneLink = document.getElementById("link-resend");

      // Validate phone number format (10-digits)
      phoneInput.addEventListener("input", (e) => {
        const val = e.target.value.replace(/\D/g, "");
        e.target.value = val;
        sendOtpBtn.disabled = val.length !== 10;
      });

      // Send OTP Click Handler
      sendOtpBtn.addEventListener("click", async () => {
        const num = phoneInput.value;
        const fullPhone = `+91${num}`;
        
        sendOtpBtn.disabled = true;
        sendOtpBtn.innerHTML = `<span>Sending...</span> <i class="fa-solid fa-spinner fa-spin"></i>`;
        
        try {
          await window.Auth.sendOTP(fullPhone);
          phoneSection.classList.remove("active");
          otpSection.classList.add("active");
        } catch (error) {
          console.error("SMS trigger failed:", error);
          alert(`Failed to send verification SMS: ${error.message}`);
          sendOtpBtn.disabled = false;
          sendOtpBtn.innerHTML = `<span>Send OTP</span> <i class="fa-solid fa-arrow-right"></i>`;
        }
      });

      // Verify OTP Click Handler
      verifyOtpBtn.addEventListener("click", async () => {
        const code = otpInput.value.replace(/\D/g, "");
        if (code.length !== 6) {
          alert("Please enter a valid 6-digit verification code.");
          return;
        }

        verifyOtpBtn.disabled = true;
        verifyOtpBtn.innerHTML = `<span>Verifying...</span> <i class="fa-solid fa-spinner fa-spin"></i>`;

        try {
          const { user, profileComplete } = await window.Auth.verifyOTP(code);
          
          if (profileComplete) {
            window.location.href = "index.html";
          } else {
            window.location.href = "profile.html";
          }
        } catch (error) {
          console.error("Code verification failed:", error);
          alert(`Invalid OTP code entered. ${error.message}`);
          verifyOtpBtn.disabled = false;
          verifyOtpBtn.innerHTML = `<span>Verify OTP</span> <i class="fa-solid fa-check"></i>`;
        }
      });

      // Change number link click
      changePhoneLink.addEventListener("click", (e) => {
        e.preventDefault();
        otpSection.classList.remove("active");
        phoneSection.classList.add("active");
        sendOtpBtn.disabled = false;
        sendOtpBtn.innerHTML = `<span>Send OTP</span> <i class="fa-solid fa-arrow-right"></i>`;
        phoneInput.value = "";
        otpInput.value = "";
      });
    });
  </script>
</body>
</html>
